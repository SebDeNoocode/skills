<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="1160" height="400" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="22" font-weight="800" fill="#FFFFFF">Install &amp; use a skill — the journey</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="80" width="200" height="168" rx="12" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="54" cy="106" r="13" fill="#6B4EFF"/><text x="54" y="111" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="75" y="111" font-size="14" font-weight="800" fill="#1D1B29">Import</text><text x="46" y="136" font-size="11.5" fill="#4A4661">Settings → Skills →</text><text x="46" y="153" font-size="11.5" fill="#4A4661">Import: drop the .zip</text><text x="46" y="170" font-size="11.5" fill="#4A4661">(SKILL.md at root) or the</text><text x="46" y="187" font-size="11.5" fill="#4A4661">.md (YAML frontmatter).</text><line x1="230" y1="164.0" x2="258" y2="164.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#a)"/><rect x="264" y="80" width="200" height="168" rx="12" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="288" cy="106" r="13" fill="#6B4EFF"/><text x="288" y="111" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="309" y="111" font-size="14" font-weight="800" fill="#1D1B29">New conversation</text><text x="280" y="136" font-size="11.5" fill="#4A4661">No reboot: open a new</text><text x="280" y="153" font-size="11.5" fill="#4A4661">conversation with the</text><text x="280" y="170" font-size="11.5" fill="#4A4661">Qonto connector active</text><text x="280" y="187" font-size="11.5" fill="#4A4661">(OAuth). Refresh if the</text><text x="280" y="204" font-size="11.5" fill="#4A4661">skill doesn&#x27;t show.</text><line x1="464" y1="164.0" x2="492" y2="164.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#a)"/><rect x="498" y="80" width="200" height="168" rx="12" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="522" cy="106" r="13" fill="#6B4EFF"/><text x="522" y="111" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="543" y="111" font-size="14" font-weight="800" fill="#1D1B29">Invoke</text><text x="514" y="136" font-size="11.5" fill="#4A4661">Type “/” → pick the skill</text><text x="514" y="153" font-size="11.5" fill="#4A4661">→ write your request after</text><text x="514" y="170" font-size="11.5" fill="#4A4661">it. Or plain language: the</text><text x="514" y="187" font-size="11.5" fill="#4A4661">description auto-triggers</text><text x="514" y="204" font-size="11.5" fill="#4A4661">the skill.</text><line x1="698" y1="164.0" x2="726" y2="164.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#a)"/><rect x="732" y="80" width="200" height="168" rx="12" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="756" cy="106" r="13" fill="#6B4EFF"/><text x="756" y="111" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="777" y="111" font-size="14" font-weight="800" fill="#1D1B29">The skill works</text><text x="748" y="136" font-size="11.5" fill="#4A4661">Reads through the Qonto</text><text x="748" y="153" font-size="11.5" fill="#4A4661">MCP (get_organization</text><text x="748" y="170" font-size="11.5" fill="#4A4661">first, paginated). Every</text><text x="748" y="187" font-size="11.5" fill="#4A4661">write is confirmed — money</text><text x="748" y="204" font-size="11.5" fill="#4A4661">moves only after SCA.</text><line x1="932" y1="164.0" x2="960" y2="164.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#a)"/><rect x="966" y="80" width="200" height="168" rx="12" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="990" cy="106" r="13" fill="#FFFFFF"/><text x="990" y="111" font-size="13" font-weight="800" fill="#6B4EFF" text-anchor="middle">5</text><text x="1011" y="111" font-size="14" font-weight="800" fill="#FFFFFF">Result</text><text x="982" y="136" font-size="11.5" fill="#F1EDFF">Tables in the</text><text x="982" y="153" font-size="11.5" fill="#F1EDFF">conversation, HTML</text><text x="982" y="170" font-size="11.5" fill="#F1EDFF">dashboard when the host</text><text x="982" y="187" font-size="11.5" fill="#F1EDFF">renders it, email drafts —</text><text x="982" y="204" font-size="11.5" fill="#F1EDFF">nothing leaves without</text><text x="982" y="221" font-size="11.5" fill="#F1EDFF">you.</text><rect x="30" y="282" width="1100" height="66" rx="10" fill="none" stroke="#8B87A0" stroke-width="1.5" stroke-dasharray="6 5"/><text x="50" y="308" font-size="12.5" fill="#F1EDFF">Claude Code: cp SKILL.md → ~/.claude/skills/&lt;name&gt;/ then RESTART the session — the skill becomes /qonto-… (same invocation).</text></svg>