# Regenerates the marketplace manifests and the README table from the plugin directories after every merge to
# main, validates the result, and proposes it in a pull request, since the main ruleset refuses a direct push.
# Contributors never edit .claude-plugin/marketplace.json, .agents/plugins/marketplace.json or the table in README.md.
name: marketplace

on:
  push:
    branches: [main]
    paths:
      - "featured/**"
      - "community/**"
      - ".github/scripts/marketplace.py"
  workflow_dispatch:

permissions:
  contents: write        # push the regeneration branch
  pull-requests: write   # open or close its pull request
  actions: write         # dispatch the format check on it

concurrency:
  group: marketplace
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'qonto/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild the manifests and the README table
        run: python3 .github/scripts/marketplace.py

      - name: Validate them with the plugin validator (pinned)
        # --strict turns warnings into errors, and an empty marketplace is a warning: skip until the first plugin lands.
        run: |
          count=$(python3 -c 'import json; print(len(json.load(open(".claude-plugin/marketplace.json"))["plugins"]))')
          if [ "$count" = "0" ]; then
            echo "no plugins yet, nothing to validate"; exit 0
          fi
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.269
          claude plugin validate . --strict

      - name: Open or update the regeneration pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: marketplace/regenerate
        # A pull request opened with GITHUB_TOKEN starts no pull_request run, so dispatch the trusted main workflow.
        # A maintainer approves and merges; the next merge to main rebuilds the branch from scratch.
        run: |
          files=(.claude-plugin/marketplace.json .agents/plugins/marketplace.json README.md)
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if git diff --quiet -- "${files[@]}"; then
            echo "manifests already up to date"
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "Main already has these manifests, nothing to regenerate."
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "${files[@]}"
          git commit -m "chore(marketplace): regenerate the manifests"
          git push --force origin "$BRANCH"
          if [ -z "$pr" ]; then
            url=$(gh pr create --base main --head "$BRANCH" --title "chore(marketplace): regenerate the manifests" \
              --body "Rendered by \`.github/scripts/marketplace.py\` from the plugin directories on main at ${GITHUB_SHA}. Review the diff and merge, and the new plugins become installable.")
            pr=${url##*/}
          fi
          gh workflow run format-check.yml --ref main -f pr="$pr"
