# Format check: public, deterministic shape rules for skill submissions. Logs are readable by anyone, failures
# post an actionable comment. No secrets, no pull_request_target, no self-hosted runner.
name: format check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: format-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the checker and the plugin validator (pinned)
        run: |
          python -m pip install --quiet -r .github/format-check/requirements.txt
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.269

      - name: Run the format check
        id: format
        env:
          FORMAT_CHECK_ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set +e
          python3 .github/format-check/format_check.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head HEAD \
            --annotations \
            --json format-check.json \
            --markdown format-check.md > /dev/null
          code=$?
          cat format-check.md >> "$GITHUB_STEP_SUMMARY"
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post or update the comment
        if: always()
        continue-on-error: true   # fork PRs have a read-only token; annotations and the summary still show
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('format-check.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.startsWith('<!-- format-check -->'));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Result
        run: |
          if [ "${{ steps.format.outputs.exit }}" != "0" ]; then
            echo "format check failed, see the summary and the PR comment"; exit 1
          fi
